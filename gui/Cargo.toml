[package]
name = "anker-webcam-gui"
version = "0.3.0"
edition = "2021"
description = "Settings panel and live preview for Anker PowerConf C200 / AnkerWork C310 webcams"
license = "MIT"
publish = false

[dependencies]
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.32"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
